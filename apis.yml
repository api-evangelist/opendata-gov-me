apis:
  - aid: opendata-gov-me:catalog
    name: Montenegro Open Data CKAN Action API
    description: >-
      CKAN Action API for Montenegro Open Data, a consistent JSON-over-HTTP interface over a catalog of 894 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://opendata.gov.me/api/3/action/.
