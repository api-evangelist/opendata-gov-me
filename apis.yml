aid: opendata-gov-me
name: Montenegro Open Data
description: >-
  Montenegro Open Data is a national government open-data portal for Montenegro running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 894 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
